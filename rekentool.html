<p id="melding">Doorsturen naar de rekentool&hellip;</p>
<p id="vangnet"></p>
<script>
// ── VASTE INGANG — besluit B28 (Project State 77, coding-spelregels 2.4) ──
// De bestandsnaam staat in dit bestand op PRECIES EEN plaats. Bij elke
// versiebump wijzigt alleen de regel hieronder.
// Uploadvolgorde: eerst het grote bestand, dan deze wijzer -- andersom wijst
// de wijzer even naar een bestand dat er nog niet is.
const DOEL = 'eurostoxx50_rekentool_v11_11.html';

// Het vangnet wordt uit DOEL opgebouwd in plaats van los opgeschreven, zodat
// een vergeten tweede vindplaats onmogelijk is. Dat is de hele reden van 2.4:
// vier gemeten uitleverfouten (bugs #29, #37, #53 en de URL-fout van 20/9).
var a = document.createElement('a');
a.href = DOEL;
a.textContent = 'Klik hier als er niets gebeurt';
document.getElementById('vangnet').appendChild(a);

window.location.replace(DOEL);
</script>
